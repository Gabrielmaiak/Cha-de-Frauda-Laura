<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Chá de Fralda da Laura</title>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--pink:#f7d3df;--pk:#f3b8cc;--soft:#fde6ee;--deep:#c94f7c;--name:#e8799f;--gold:#c9972f;--tx:#6b5a60;--ink:#4a3a40;--script:"Great Vibes","Brush Script MT",cursive;--sans:"Quicksand",system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;color:var(--tx);font:500 16px/1.5 var(--sans);background:var(--pink) radial-gradient(rgba(255,255,255,.6) 2px,transparent 2.6px) 0 0/18px 18px;background-attachment:fixed;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overflow-x:hidden}
input,textarea{-webkit-user-select:text;user-select:text}
::selection{background:transparent}
input::selection,textarea::selection{background:var(--pk)}
body.lock{overflow:hidden}
@keyframes up{from{opacity:0;transform:translateY(16px)}}
@keyframes shine{50%{filter:drop-shadow(0 6px 6px rgba(150,100,20,.25)) brightness(1.15)}}
@keyframes sway{50%{transform:rotate(2.2deg)}}
@keyframes tw{50%{opacity:.2;transform:scale(.4)}}
/* cartão do convite */
.card{position:relative;background:#fff;border-radius:26px;padding:30px 22px 24px;text-align:center;box-shadow:0 16px 44px rgba(201,79,124,.2)}
.card::before,.panel::before{content:"";position:absolute;inset:9px;border:2px solid #f6c3d4;border-radius:18px;pointer-events:none}
.card>*,.panel>*{position:relative}
.crownw{position:relative;width:min(56%,190px);margin:0 auto}
.crown{display:block;width:100%;height:auto;filter:drop-shadow(0 6px 6px rgba(150,100,20,.25));animation:shine 4.5s ease-in-out infinite}
.sp{position:absolute;width:12px;height:12px;background:#f1cf6a;clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);animation:tw 3s ease-in-out infinite}
.s1{left:-8%;top:18%}.s2{right:-6%;top:4%;animation-delay:1s}.s3{right:14%;top:-14%;animation-delay:2s;width:9px;height:9px}
.tx1{margin:14px auto 0;max-width:300px;font-size:15px;line-height:1.55}
.nm{font:400 clamp(66px,17vw,88px)/1.05 var(--script);color:var(--name);margin:8px 0 12px}
.dt{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;max-width:330px;margin:0 auto}
.dt span{font-weight:700;font-size:19px;color:var(--tx);padding:6px 4px}
.dt b{font:700 clamp(56px,13vw,70px)/1 var(--sans);color:var(--ink);padding:0 20px;border-left:2px solid var(--pk);border-right:2px solid var(--pk)}
.wk{margin:8px 0 0;font-size:14px;font-weight:600;letter-spacing:.06em;text-transform:capitalize}
.ad{margin:10px auto 0;max-width:290px;font-size:14px;line-height:1.45;color:var(--deep);font-weight:600}
.mp{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:16px}
.bt{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 22px;border:2px solid var(--deep);border-radius:999px;color:var(--deep);background:#fff;font:700 13px var(--sans);text-decoration:none;cursor:pointer;transition:background .25s,color .25s}
.bt:hover{background:var(--deep);color:#fff}
.bot{display:flex;align-items:flex-end;gap:12px;margin-top:20px;text-align:left}
.bear{flex:none;width:34%;max-width:130px;height:auto;transform-origin:50% 100%;animation:sway 5.5s ease-in-out infinite}
.bot p{margin:0 0 12px;font-size:14px;line-height:1.5;text-align:center;flex:1}
.bot b{color:var(--deep)}
/* abertura */
#intro{position:fixed;inset:0;z-index:20;display:flex;overflow:auto;padding:calc(18px + env(safe-area-inset-top,0px)) 16px calc(18px + env(safe-area-inset-bottom,0px));background:var(--pink) radial-gradient(rgba(255,255,255,.6) 2px,transparent 2.6px) 0 0/18px 18px;transition:opacity .8s}
#intro.out{opacity:0;pointer-events:none}
.iw{margin:auto;width:min(100%,440px);animation:up .9s both}
.btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:54px;margin-top:16px;border:0;border-radius:999px;background:var(--deep);color:#fff;font:700 16px var(--sans);cursor:pointer;box-shadow:0 10px 22px rgba(201,79,124,.35);transition:transform .2s,background .25s}
.btn:hover{background:#b8426f}.btn:active{transform:scale(.97)}
/* layout */
.page{max-width:1160px;margin:auto;display:grid;grid-template-columns:minmax(0,1fr);gap:22px;padding:calc(18px + env(safe-area-inset-top,0px)) 16px 80px}
.side{display:none}
.mh{padding-top:26px;padding-bottom:22px}
.mh .crownw{width:min(40%,130px)}
.mh .nm{font-size:clamp(60px,16vw,76px);margin:4px 0 6px}
.mh .mtx{margin:0;font-weight:700;color:var(--ink);font-size:15px}
.mh .ad{margin-top:6px}
.panel{position:relative;background:#fff;border-radius:26px;padding:26px 20px 28px;box-shadow:0 16px 44px rgba(201,79,124,.16)}
.ttl{font:400 clamp(44px,9vw,56px)/1.05 var(--script);color:var(--name);text-align:center;margin:0}
.sub{margin:6px auto 0;max-width:34ch;text-align:center;font-size:15px}
h3{margin:30px 0 12px;font:400 clamp(32px,6vw,38px)/1.1 var(--script);color:var(--name);display:flex;align-items:center;gap:12px}
h3::after{content:"";flex:1;height:2px;background:#f6c3d4;border-radius:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,245px),1fr));gap:10px}
.tile{display:flex;align-items:center;gap:12px;width:100%;padding:11px 12px;text-align:left;font:inherit;color:inherit;background:#fff;border:2px solid #f8dde7;border-radius:20px;cursor:pointer;transition:background .25s,border-color .25s,transform .15s,box-shadow .25s}
.tile:active{transform:scale(.98)}
.tile:focus-visible{outline:3px solid var(--pk);outline-offset:2px}
@media(hover:hover){.tile:hover{border-color:var(--pk);box-shadow:0 8px 20px rgba(201,79,124,.12)}}
.ph{flex:none;width:58px;height:58px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,var(--soft));border:2px solid #fbe3ec;display:flex;align-items:center;justify-content:center;transition:transform .4s}
.ph svg{width:36px;height:36px;fill:none;stroke:var(--deep);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.ph text{font:700 9px var(--sans);fill:var(--deep);stroke:none}
@media(hover:hover){.tile:hover .ph{transform:scale(1.08) rotate(-4deg)}}
.tx{flex:1;min-width:0}
.tx b{display:block;font-weight:700;font-size:15.5px;line-height:1.25;color:var(--ink)}
.tx small{display:block;font-size:12.5px;color:var(--tx);font-weight:500}
.tx em{display:inline-block;margin-top:4px;font:700 10px var(--sans);font-style:normal;letter-spacing:.06em;text-transform:uppercase;color:var(--deep);background:var(--soft);padding:2px 8px;border-radius:99px}
.box{flex:none;order:3;width:28px;height:28px;border-radius:50%;border:2px solid var(--pk);display:flex;align-items:center;justify-content:center;transition:background .25s,border-color .25s}
.box svg{width:15px;height:15px;fill:none;stroke:#fff;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:22;stroke-dashoffset:22;transition:stroke-dashoffset .35s .05s}
.tile.on{background:#fff5f9;border-color:var(--name)}
.tile.on .box{background:var(--deep);border-color:var(--deep)}
.tile.on .box svg{stroke-dashoffset:0}
.tile.on .ph{background:#fff;border-color:var(--name)}
.rv{opacity:0;translate:0 20px;transition:opacity .8s ease,translate .8s cubic-bezier(.2,.8,.2,1)}
.rv.in{opacity:1;translate:none}
.tile.rv{transition:background .25s,border-color .25s,transform .15s,box-shadow .25s,opacity .8s ease,translate .8s cubic-bezier(.2,.8,.2,1)}
/* formulário */
.form{margin-top:22px}
.sel{margin:14px 0 0;font-size:14px;text-align:center;line-height:1.5}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:479px){.two{grid-template-columns:1fr}}
label{display:block;margin-top:16px;font:700 13px var(--sans);color:var(--ink)}
input,textarea{display:block;width:100%;margin-top:6px;padding:14px 16px;font:500 16px var(--sans);color:var(--ink);background:#fff;border:2px solid #f8dde7;border-radius:16px;outline:none;transition:border-color .2s,box-shadow .2s}
input:focus,textarea:focus{border-color:var(--name);box-shadow:0 0 0 4px #fde6ee}
textarea{resize:vertical;min-height:90px}
.err{border-color:#d1283f!important}
.msg{min-height:22px;margin-top:10px;font-size:14px;font-weight:600;color:#c4203a;text-align:center}
/* agradecimento */
.done{position:fixed;inset:0;z-index:30;display:none;overflow:auto;padding:calc(18px + env(safe-area-inset-top,0px)) 16px calc(18px + env(safe-area-inset-bottom,0px));background:var(--pink) radial-gradient(rgba(255,255,255,.6) 2px,transparent 2.6px) 0 0/18px 18px}
.done.show{display:flex;animation:up .6s both}
.dc{margin:auto;width:min(100%,460px)}
.dc .crownw{width:min(44%,140px)}
.dc h4{font:400 clamp(46px,12vw,60px)/1.05 var(--script);color:var(--name);margin:10px 0 6px}
.dc p{margin:0 auto;max-width:34ch}
.ev{margin:16px auto 0;padding:12px 14px;border-radius:16px;background:var(--soft);font-weight:700;font-size:14.5px;line-height:1.5;color:var(--ink)}
.fm{font:400 34px/1.1 var(--script);color:var(--name);margin-top:16px!important}
.nt{display:block;margin:12px auto 0;font-size:12px;max-width:32ch}
.dc .bt{margin-top:18px}
@media(min-width:980px){
 .page{grid-template-columns:minmax(380px,440px) minmax(0,1fr);gap:40px;padding:40px 28px 100px;align-items:start}
 .side{display:block;position:sticky;top:24px}
 .mh{display:none}
 .panel{padding:32px 30px 34px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
